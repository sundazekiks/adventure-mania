<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Skills</title>
</head>

<body
    class="min-h-screen bg-linear-to-br from-slate-900 via-slate-800 to-indigo-950 px-4 py-10 text-slate-100 antialiased">

    <main class="mx-auto w-full max-w-2xl">

        <!-- Header -->
        <div class="mb-8 flex items-center justify-between">
            <div>
                <p class="text-xs font-semibold uppercase tracking-widest text-indigo-300">Skills</p>
                <h1 class="text-3xl font-extrabold"
                    th:text="${characterClass != null} ? ${characterClass} : 'Character'">Warrior</h1>
            </div>
            <a th:href="@{/dashboard}"
                class="rounded-lg border border-white/10 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-white/10">
                ← Dashboard
            </a>
        </div>

        <!-- Skill list -->
        <ul class="grid gap-4 sm:grid-cols-2" th:if="${!skills.isEmpty()}">
            <li th:each="skill : ${skills}"
                class="rounded-2xl border border-white/10 bg-slate-800/70 p-5 shadow-lg shadow-black/20">
                <div class="flex items-start justify-between gap-3">
                    <h2 class="text-lg font-bold text-white" th:text="${skill.name}">Slash</h2>
                    <span class="shrink-0 rounded-full bg-indigo-500/20 px-3 py-1 text-xs font-semibold text-indigo-300"
                        th:text="${skill.typeSkill}">Attack</span>
                </div>
                <p class="mt-2 text-sm text-slate-400" th:text="${skill.description}">A strong sword strike.</p>
            </li>
        </ul>

        <!-- Empty state -->
        <div th:if="${skills.isEmpty()}"
            class="rounded-2xl border border-dashed border-slate-600 bg-slate-800/40 p-10 text-center">
            <p class="text-4xl">📜</p>
            <p class="mt-3 font-semibold text-slate-200">No skills learned yet</p>
            <p class="mt-1 text-sm text-slate-400">Skills you unlock will show up here.</p>
        </div>

    </main>
</body>

</html>
