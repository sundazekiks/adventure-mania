<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Monsters</title>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-6xl px-4 py-10">

        <header class="mb-8 flex items-end justify-between">
            <div>

                <h1 class="text-3xl font-bold tracking-tight"> <a th:href="@{/dashboard}" class="mr-5 text-md">&lt;-</a>
                    Bestiary</h1>
                <p class="mt-1 text-sm text-slate-400">
                    <span th:text="${#lists.size(monsters)}">0</span> monsters found
                </p>
            </div>
        </header>

        <!-- Empty state -->
        <p th:if="${#lists.isEmpty(monsters)}"
            class="rounded-lg border border-dashed border-slate-700 p-8 text-center text-slate-400">
            No monsters found.
        </p>

        <!-- Monster grid -->
        <section class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <article th:each="monster : ${monsters}"
                class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-lg transition hover:-translate-y-1 hover:border-indigo-500">

                <div class="flex items-start justify-between gap-3">
                    <h2 class="text-lg font-semibold" th:text="${monster.name}">Monster name</h2>
                    <span
                        class="shrink-0 rounded-full bg-indigo-500/20 px-3 py-1 text-xs font-semibold text-indigo-300">
                        Lv <span th:text="${monster.level}">1</span>
                    </span>
                </div>

                <dl class="mt-4 grid grid-cols-2 gap-3 text-center">
                    <div class="rounded-lg bg-slate-800 p-3">
                        <dt class="text-xs uppercase tracking-wide text-slate-400">HP</dt>
                        <dd class="mt-1 text-xl font-bold text-rose-400" th:text="${monster.hp}">100</dd>
                    </div>
                    <div class="rounded-lg bg-slate-800 p-3">
                        <dt class="text-xs uppercase tracking-wide text-slate-400">EXP drop</dt>
                        <dd class="mt-1 text-xl font-bold text-amber-400" th:text="${monster.expDrop}">280</dd>
                    </div>
                </dl>

                <div class="mt-4">
                    <h3 class="text-xs uppercase tracking-wide text-slate-400">Skills</h3>
                    <div class="mt-2 flex flex-wrap gap-2">
                        <span th:each="skill : ${monster.skills}" th:text="${skill.skillName}"
                            class="rounded-md bg-emerald-500/15 px-2 py-1 text-xs font-medium text-emerald-300">
                            Skill
                        </span>
                        <span th:if="${#lists.isEmpty(monster.skills)}" class="text-xs text-slate-500">
                            No skills
                        </span>
                    </div>
                </div>
            </article>
        </section>

    </main>
</body>

</html>
