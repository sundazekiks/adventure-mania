<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Adventure Mania!</title>
</head>

<body
    class="flex min-h-screen items-center justify-center bg-linear-to-br from-slate-900 via-slate-800 to-indigo-950 px-4 py-10 text-slate-100 antialiased">

    <main class="w-full max-w-lg text-center">

        <!-- Hero -->
        <p class="text-6xl">⚔️</p>
        <p class="mt-6 text-sm font-semibold uppercase tracking-widest text-indigo-300">Welcome to</p>
        <h1 class="mt-2 bg-linear-to-r from-indigo-400 via-violet-400 to-fuchsia-400 bg-clip-text text-5xl font-extrabold text-transparent sm:text-6xl"
            th:text="${game_name}">Adventure Mania!</h1>
        <p class="mt-4 text-slate-400">Create your hero, grow stronger, and head into battle.</p>

        <!-- Actions -->
        <div class="mt-10 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a th:href="@{/sign-in}"
                class="rounded-lg bg-linear-to-r from-indigo-600 to-violet-600 px-8 py-3 font-semibold text-white shadow-lg shadow-indigo-900/30 transition hover:from-indigo-500 hover:to-violet-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 active:scale-[0.99]">
                Sign In
            </a>
            <a th:href="@{/sign-up}"
                class="rounded-lg border border-emerald-400/40 bg-emerald-500/10 px-8 py-3 font-semibold text-emerald-300 transition hover:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-400 active:scale-[0.99]">
                Sign Up
            </a>
        </div>

    </main>
</body>

</html>
