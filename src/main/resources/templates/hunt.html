<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 p-6 sm:p-10">
    <div class="max-w-3xl mx-auto grid gap-6">

        <!-- Player -->
        <div class="bg-slate-800 rounded-xl p-6 shadow-lg" th:if="${user != null}">
            <h2 class="text-xl font-bold mb-3" th:text="${user.username}">Player</h2>

            <!-- Only shows if you add a "character" attribute in the controller -->
            <div th:if="${character != null}" class="space-y-1">
                <div class="flex justify-between"><span class="text-slate-400">Class</span><strong
                        th:text="${character.charClass}">Warrior</strong></div>
                <div class="flex justify-between"><span class="text-slate-400">Level</span><strong
                        th:text="${character.level}">1</strong></div>
                <div class="flex justify-between"><span class="text-slate-400">HP</span><strong
                        th:text="${character.hp}">100</strong></div>
                <div class="flex justify-between"><span class="text-slate-400">EXP</span>
                    <strong><span th:text="${character.current_exp}">0</span> / <span
                            th:text="${character.max_exp}">1000</span></strong>
                </div>
                <div class="w-full h-2 bg-slate-600 rounded-full overflow-hidden mt-2">
                    <div class="h-full bg-emerald-500"
                        th:style="'width:' + ${character.current_exp * 100 / character.max_exp} + '%'"></div>
                </div>
            </div>
        </div>

        <!-- Monster -->
        <div class="bg-slate-800 rounded-xl p-6 shadow-lg" th:if="${monster != null}">
            <h2 class="text-2xl font-bold mb-4">
                A wild <span class="text-red-400" th:text="${monster.name}">Monster</span> appears!
            </h2>

            <div class="space-y-1">
                <div class="flex justify-between"><span class="text-slate-400">Level</span><strong
                        th:text="${monster.level}">1</strong></div>
                <div class="flex justify-between"><span class="text-slate-400">HP</span><strong
                        th:text="${monster.hp}">100</strong></div>
                <div class="w-full h-3 bg-slate-600 rounded-full overflow-hidden my-2">
                    <div class="h-full w-full bg-red-500"></div>
                </div>
                <div class="flex justify-between"><span class="text-slate-400">EXP Drop</span><strong
                        th:text="${monster.expDrop}">50</strong></div>
            </div>

            <h3 class="text-lg font-semibold mt-5 mb-2">Skills</h3>
            <ul class="flex flex-wrap gap-2" th:if="${!#lists.isEmpty(monster.skills)}">
                <li th:each="skill : ${monster.skills}" th:text="${skill.name}"
                    class="bg-slate-700 text-sm px-3 py-1 rounded-full">Skill</li>
            </ul>
            <p class="italic text-slate-500" th:if="${#lists.isEmpty(monster.skills)}">This monster has no skills.</p>
        </div>

        <!-- Fallback -->
        <div class="bg-slate-800 rounded-xl p-6" th:if="${monster == null}">
            <p class="italic text-slate-500">No monsters found. Try again.</p>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-3">
            <a th:href="@{/hunt/attack(monster_id=${monster.id}, character_id=${user.id})}"
                class="flex-1 py-3 rounded-lg bg-red-600 hover:bg-red-500 active:bg-red-700 font-semibold transition-colors">
                ⚔ Attack
            </a>
            <a th:href="@{/hunt}"
                class="flex-1 py-3 rounded-lg bg-slate-600 hover:bg-slate-500 text-center font-semibold transition-colors">
                Find another
            </a>
            <a th:href="@{/}"
                class="flex-1 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 text-center font-semibold transition-colors">
                Flee
            </a>
        </div>

    </div>
</body>

</html>
