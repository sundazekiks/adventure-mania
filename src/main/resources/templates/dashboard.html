<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <title>Dashboard</title>
</head>

<body class="min-h-screen bg-linear-to-br from-slate-900 via-slate-800 to-indigo-950 text-slate-100 antialiased">

    <!-- Top bar -->
    <header class="border-b border-white/10 bg-white/5 backdrop-blur">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3 sm:px-6">
            <span class="text-lg font-extrabold tracking-wide">
                ⚔️ <span class="text-indigo-400">Battlefield</span>
            </span>

            <div class="flex items-center gap-3">
                <span class="hidden text-sm text-slate-300 sm:inline" th:text="${user}">User</span>
                <a th:href="@{/auth/logout}"
                    class="rounded-lg bg-red-500/90 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-400">
                    Logout
                </a>
            </div>
        </div>
    </header>

    <main class="mx-auto flex max-w-5xl flex-col items-center px-4 py-10 sm:px-6">

        <!-- Welcome -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold sm:text-4xl">Welcome to the Battlefield</h1>
            <p class="mt-2 text-slate-400">Check your stats before heading into battle.</p>
        </div>

        <!-- Character card -->
        <section th:if="${characterDetails != null}"
            th:with="expPercent=${characterDetails.maxExp > 0 ? characterDetails.currentExp * 100 / characterDetails.maxExp : 0}"
            class="w-full max-w-md overflow-hidden rounded-2xl border border-white/10 bg-slate-800/70 shadow-2xl shadow-black/30">

            <!-- Header -->
            <div class="flex items-center gap-4 bg-linear-to-r from-indigo-600 to-violet-600 px-6 py-5">
                <div class="flex h-14 w-14 items-center justify-center rounded-full bg-white/20 text-2xl">
                    🛡️
                </div>
                <div class="flex-1">
                    <p class="text-xs font-semibold uppercase tracking-widest text-indigo-200">Class</p>
                    <h2 class="text-xl font-bold text-white" th:text="${characterDetails.characterClass}">Warrior</h2>
                </div>
                <span class="rounded-full bg-white/20 px-3 py-1 text-sm font-bold text-white">
                    Lv <span th:text="${characterDetails.level}">1</span>
                </span>
            </div>

            <!-- Body -->
            <div class="space-y-6 p-6">

                <!-- Stat tiles -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="rounded-xl border border-red-500/20 bg-red-500/10 p-4">
                        <p class="text-xs font-semibold uppercase tracking-wider text-red-300">HP</p>
                        <p class="mt-1 text-2xl font-extrabold text-red-400" th:text="${characterDetails.hp}">100</p>
                    </div>
                    <div class="rounded-xl border border-amber-500/20 bg-amber-500/10 p-4">
                        <p class="text-xs font-semibold uppercase tracking-wider text-amber-300">To next level</p>
                        <p class="mt-1 text-2xl font-extrabold text-amber-400"
                            th:text="${characterDetails.maxExp - characterDetails.currentExp}">1000</p>
                    </div>
                </div>

                <!-- EXP bar -->
                <div>
                    <div class="mb-2 flex items-center justify-between text-sm">
                        <span class="font-semibold text-slate-200">Experience</span>
                        <span class="text-slate-400"
                            th:text="${characterDetails.currentExp} + ' / ' + ${characterDetails.maxExp}">0 /
                            1000</span>
                    </div>
                    <div class="h-3 w-full overflow-hidden rounded-full bg-slate-700">
                        <div class="h-full rounded-full bg-linear-to-r from-emerald-400 to-teal-400 transition-all duration-500"
                            style="width: 0%" th:style="'width:' + ${expPercent} + '%'">
                        </div>
                    </div>
                    <p class="mt-1 text-right text-xs text-slate-500" th:text="${expPercent} + '%'">0%</p>
                </div>
            </div>
        </section>
        <section class="mt-8 flex gap-4">
            <a th:href="@{/hunt}"
                class="rounded-lg bg-linear-to-r from-indigo-600 to-violet-600 px-8 py-3 font-semibold text-white shadow-lg shadow-indigo-900/30 transition hover:from-indigo-500 hover:to-violet-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 active:scale-[0.99]">
                Hunt
            </a>
            <a th:href="@{/monsters}"
                class="rounded-lg bg-linear-to-r from-emerald-600 to-teal-600 px-8 py-3 font-semibold text-white shadow-lg shadow-emerald-900/30 transition hover:from-emerald-500 hover:to-teal-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 active:scale-[0.99]">
                Monster Guide
            </a>
            <a th:href="@{/character/skills(id=${characterDetails.id})}"
                class="rounded-lg bg-linear-to-r from-emerald-600 to-teal-600 px-8 py-3 font-semibold text-white shadow-lg shadow-emerald-900/30 transition hover:from-emerald-500 hover:to-teal-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 active:scale-[0.99]">
                Character Spells
            </a>
        </section>
        <!-- No character -->
        <section th:if="${characterDetails == null}"
            class="w-full max-w-md rounded-2xl border border-dashed border-slate-600 bg-slate-800/40 p-10 text-center">
            <p class="text-4xl">🗡️</p>
            <p class="mt-3 font-semibold text-slate-200">No character yet</p>
            <p class="mt-1 text-sm text-slate-400">Create one to start playing.</p>
        </section>

    </main>
</body>

</html>
