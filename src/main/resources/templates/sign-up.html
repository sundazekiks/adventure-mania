<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <title>Sign Up</title>
</head>

<body
    class="flex min-h-screen items-center justify-center bg-linear-to-br from-slate-900 via-slate-800 to-indigo-950 px-4 py-10 text-slate-100 antialiased">

    <main class="w-full max-w-md">

        <!-- Title -->
        <div class="mb-8 text-center">
            <p class="text-5xl">🛡️</p>
            <h1 class="mt-3 text-3xl font-extrabold sm:text-4xl">
                Join the <span class="text-indigo-400">Battlefield</span>
            </h1>
            <p class="mt-2 text-slate-400">Create an account to start your adventure.</p>
        </div>

        <!-- Card -->
        <div class="rounded-2xl border border-white/10 bg-slate-800/70 p-8 shadow-2xl shadow-black/30 backdrop-blur">

            <!-- Error message -->
            <div th:if="${errorMessage}"
                class="mb-6 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300"
                role="alert" th:text="${errorMessage}">
                Username already taken
            </div>

            <form th:action="@{/auth/signup}" method="POST" class="space-y-5">

                <div>
                    <label for="username" class="mb-2 block text-sm font-semibold text-slate-300">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Choose a username"
                        class="w-full rounded-lg border border-slate-600 bg-slate-900/60 px-4 py-2.5 text-slate-100 placeholder-slate-500 transition focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                </div>

                <div>
                    <label for="email" class="mb-2 block text-sm font-semibold text-slate-300">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        placeholder="you@example.com"
                        class="w-full rounded-lg border border-slate-600 bg-slate-900/60 px-4 py-2.5 text-slate-100 placeholder-slate-500 transition focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-semibold text-slate-300">Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                        autocomplete="new-password" placeholder="At least 8 characters"
                        class="w-full rounded-lg border border-slate-600 bg-slate-900/60 px-4 py-2.5 text-slate-100 placeholder-slate-500 transition focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                </div>

                <div>
                    <label for="characterClass" class="mb-2 block text-sm font-semibold text-slate-300">Character
                        Class</label>
                    <select id="characterClass" name="characterClass" required
                        class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 transition focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 appearance-none [color-scheme:dark]">
                        <option value="" disabled selected>Choose your class</option>
                        <option value="Warrior">Warrior</option>
                        <option value="Cleric">Cleric</option>
                        <option value="Mage">Mage</option>
                        <option value="Rogue">Rogue</option>
                    </select>
                </div>

                <button type="submit"
                    class="w-full rounded-lg bg-linear-to-r from-indigo-600 to-violet-600 px-4 py-3 font-semibold text-white shadow-lg shadow-indigo-900/30 transition hover:from-indigo-500 hover:to-violet-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 active:scale-[0.99]">
                    Create account
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-400">
                Already have an account?
                <a th:href="@{/}" class="font-semibold text-indigo-400 transition hover:text-indigo-300">Log in</a>
            </p>
        </div>
    </main>
</body>

</html>
